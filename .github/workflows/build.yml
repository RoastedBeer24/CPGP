# 푸시할 때마다 자동 테스트를 돌리고 Windows 실행 파일을 만든다.
# 만든 파일은 GitHub의 Actions 탭 > 해당 실행 > Artifacts 에서 받을 수 있다.
# 기본 브랜치에 푸시하면 릴리스(build-<커밋 수>)로도 올린다. 게임의 자동 업데이트가 이 릴리스를 받는다.
name: 테스트와 Windows 빌드

on:
  push:
  workflow_dispatch:

# 동시에 두 번 돌면 릴리스 순서가 꼬일 수 있으므로 같은 브랜치는 하나씩 돌린다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 빌드 번호(커밋 수)를 세려면 전체 기록이 필요하다.
          fetch-depth: 0

      - name: Godot와 내보내기 템플릿 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: godot-4.5.1-stable-windows-templates

      - name: 자동 테스트
        run: tools/test.sh

      - name: Windows 실행 파일 만들기
        run: tools/export_windows.sh

      - name: 실행 파일 올리기
        uses: actions/upload-artifact@v4
        with:
          name: Crossfield-windows
          path: |
            build/windows/Crossfield.exe
            build/windows/Crossfield.console.exe
            build/windows/README.txt
          retention-days: 30

      - name: 릴리스로 올리기 (자동 업데이트용)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(git rev-list --count HEAD)"
          tag="build-$build"
          notes="$(git log -1 --format='%s%n%n커밋 %h')"
          # 옛 이름(CyberUniverse)으로 설치한 게임은 옛 이름의 zip을 받는다(src/core/updater.gd). 둘 다 올린다.
          zips=(build/Crossfield-windows.zip build/CyberUniverse-windows.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${zips[@]}" --clobber
          else
            gh release create "$tag" "${zips[@]}" \
              --target "$GITHUB_SHA" --title "빌드 $build" --notes "$notes" --latest
          fi
          # 오래된 릴리스는 최근 5개만 남긴다. 목록은 최신순이다.
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | tail -n +6 \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
